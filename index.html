<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK BMS Monitor & Control</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* Статуси вгорі */
        .status-header {
            display: flex;
            justify-content: space-between;
            background: #1b1b1b;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #2c2c2c;
        }
        .badge-on { color: #00E676; }
        .badge-off { color: #FF5252; }

        /* Головна кругова секція */
        .gauge-card {
            background: #1b1b1b;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            border: 1px solid #2c2c2c;
            position: relative;
        }
        .gauge-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            /* Початковий базовий градієнт */
            background: conic-gradient(from 180deg at 50% 50%, #5a3333 0deg, #2b4d3b 180deg, #234854 360deg);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .gauge-inner {
            width: 160px;
            height: 160px;
            background: #1b1b1b;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .soc-text {
            font-size: 38px;
            font-weight: bold;
            color: #00E676;
            line-height: 1;
        }
        .inner-sub-pill {
            background: #262626;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 3px 12px;
            margin-top: 6px;
            font-size: 14px;
            color: #fff;
        }

        /* Картки сітки */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .card {
            background: #1b1b1b;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #2c2c2c;
            text-align: center;
        }
        .card-title { font-size: 12px; color: #9e9e9e; margin-bottom: 5px; }
        .card-val { font-size: 20px; font-weight: bold; }

        /* Поля налаштування */
        .settings-card {
            background: #1b1b1b;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #2c2c2c;
        }
        .settings-card input {
            width: 100%;
            padding: 8px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            margin-top: 4px;
            margin-bottom: 10px;
            box-sizing: border-box;
            text-align: center;
            font-size: 15px;
        }
        .save-btn {
            width: 100%;
            padding: 10px;
            background: #00E676;
            border: none;
            color: #121212;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        #log { text-align: center; font-size: 12px; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Статуси Chg / Dsg / Bal вгорі -->
        <div class="status-header">
            <div>Chg: <span id="status-chg" class="badge-off">OFF</span></div>
            <div>Dsg: <span id="status-dsg" class="badge-off">OFF</span></div>
            <div>Bal: <span id="status-bal" class="badge-off">OFF</span></div>
        </div>

        <!-- Центральний радіальний індикатор -->
        <div class="gauge-card">
            <div class="gauge-circle" id="gauge-bg">
                <div class="gauge-inner">
                    <div class="soc-text" id="val-soc">0%</div>
                    <div class="inner-sub-pill" id="val-voltage">0.00V</div>
                    <div class="inner-sub-pill" id="val-current" style="margin-top: 4px;">0.00A</div>
                </div>
            </div>
        </div>

        <!-- Блок комірок (Cell 1, 2, 3) -->
        <div class="grid-2">
            <div class="card">
                <div class="card-title">Cell 1 (V6)</div>
                <div class="card-val" id="val-c1" style="color: #00bcd4;">0.000 V</div>
            </div>
            <div class="card">
                <div class="card-title">Cell 2 (V7)</div>
                <div class="card-val" id="val-c2" style="color: #ffeb3b;">0.000 V</div>
            </div>
        </div>
        <div class="grid-2">
            <div class="card">
                <div class="card-title">Cell 3 (V8)</div>
                <div class="card-val" id="val-c3" style="color: #ff9800;">0.000 V</div>
            </div>
            <div class="card">
                <div class="card-title">Статус системи</div>
                <div class="card-val" style="color: #00E676; font-size: 16px; margin-top: 4px;" id="sys-status">Normal</div>
            </div>
        </div>

        <!-- Пороги напруги V9 та V10 -->
        <div class="settings-card">
            <label style="font-size: 12px; color: #aaa;">Увімк. заряду (V9):</label>
            <input type="number" step="0.1" id="input-v9" value="11.1">
            
            <label style="font-size: 12px; color: #aaa;">Вимк. заряду (V10):</label>
            <input type="number" step="0.1" id="input-v10" value="12.6">
            
            <button class="save-btn" onclick="saveThresholds()">Сохранить</button>
            <div id="log"></div>
        </div>
    </div>

    <script>
        const AUTH_TOKEN = "r8QZA1jjU82T-gv6bMEUtl7qddJOXLTd";
        const BLYNK_SERVER = "blynk.cloud";

        async function updateData() {
            const pins = ['V0', 'V1', 'V2', 'V3', 'V4', 'V5', 'V6', 'V7', 'V8'];
            try {
                for (let pin of pins) {
                    let response = await fetch(`https://${BLYNK_SERVER}/external/api/get?token=${AUTH_TOKEN}&${pin}`);
                    if (response.ok) {
                        let val = await response.text();
                        val = val.replace(/"/g, '');
                        updateElementValue(pin, val);
                    }
                }
            } catch (error) {
                console.error("Помилка зв'язку з Blynk API:", error);
            }
        }

        function updateElementValue(pin, val) {
            let numVal = parseFloat(val) || 0;
            switch(pin) {
                case 'V0': 
                    document.getElementById('val-soc').innerText = Math.round(numVal) + '%'; 
                    
                    // Динамічний розрахунок насиченості (saturation) та яскравості (lightness) залежно від % (0 до 100)
                    // При 0% насиченість низька (бліді пастельні тони), при 100% максимальна соковитість
                    let saturation = Math.round(30 + (numVal * 0.7)); // від 30% до 100%
                    let lightness = Math.round(35 + (numVal * 0.15));  // від 35% до 50%
                    
                    // Плавна зміна відтінків (hue): від червоного (0deg) через зелений до синього (210deg)
                    let cRed = `hsl(0, ${saturation}%, ${lightness}%)`;
                    let cGreen = `hsl(140, ${saturation}%, ${lightness}%)`;
                    let cBlue = `hsl(210, ${saturation}%, ${lightness}%)`;

                    // Оновлюємо градіант з урахуванням стику внизу (180deg)
                    let gradientStyle = `conic-gradient(from 180deg at 50% 50%, ${cRed} 0deg, ${cRed} 90deg, ${cGreen} 160deg, ${cBlue} 260deg, ${cBlue} 360deg)`;
                    document.getElementById('gauge-bg').style.background = gradientStyle;
                    break;

                case 'V1': document.getElementById('val-voltage').innerText = numVal.toFixed(2) + 'V'; break;
                case 'V2': document.getElementById('val-current').innerText = numVal.toFixed(2) + 'A'; break;
                case 'V3': setStatusBadge('status-chg', val); break;
                case 'V4': setStatusBadge('status-dsg', val); break;
                case 'V5': setStatusBadge('status-bal', val); break;
                case 'V6': document.getElementById('val-c1').innerText = numVal.toFixed(3) + ' V'; break;
                case 'V7': document.getElementById('val-c2').innerText = numVal.toFixed(3) + ' V'; break;
                case 'V8': document.getElementById('val-c3').innerText = numVal.toFixed(3) + ' V'; break;
            }
        }

        function setStatusBadge(elementId, val) {
            let el = document.getElementById(elementId);
            if (val == "1" || val.toLowerCase() === "true") {
                el.className = "badge-on";
                el.innerText = "ON";
            } else {
                el.className = "badge-off";
                el.innerText = "OFF";
            }
        }

        async function saveThresholds() {
            let v9 = document.getElementById('input-v9').value;
            let v10 = document.getElementById('input-v10').value;
            let logEl = document.getElementById('log');

            try {
                let res1 = await fetch(`https://${BLYNK_SERVER}/external/api/update?token=${AUTH_TOKEN}&v9=${v9}`);
                let res2 = await fetch(`https://${BLYNK_SERVER}/external/api/update?token=${AUTH_TOKEN}&v10=${v10}`);
                
                if (res1.ok && res2.ok) {
                    logEl.style.color = "#00E676";
                    logEl.innerText = "Пороги успішно збережено!";
                } else {
                    logEl.style.color = "#FF5252";
                    logEl.innerText = "Помилка збереження!";
                }
            } catch (error) {
                logEl.style.color = "#FF5252";
                logEl.innerText = "Помилка мережі!";
            }
        }

        setInterval(updateData, 3000);
        updateData();
    </script>

</body>
</html>
